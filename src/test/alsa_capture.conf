# ALSA's configuration for the playback tests, through ALSA_CONFIG_PATH: the
# default device writes the raw samples it is given to the file named by
# NSOUND_ALSA_CAPTURE and plays nothing, there may be no sound card.

pcm.!default {
    type file
    slave.pcm {
        type null
    }
    file {
        @func getenv
        vars [ NSOUND_ALSA_CAPTURE ]
        default "/dev/null"
    }
    format "raw"
}
