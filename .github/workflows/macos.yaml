name: macos

on:
  push:
    branches:
    - master
    - 'release/**'
  pull_request:
    branches:
    - master
    - 'release/**'

# Checks show as "<platform> / <build system> / <task>".

jobs:

  pip:

    name: pip / python ${{ matrix.python }}

    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python the package supports.
        python: ['3.10', '3.14']

    steps:
    - uses: actions/checkout@v7
      name: Checkout source
    - uses: actions/setup-python@v7
      name: Install Python
      with:
        python-version: ${{ matrix.python }}
    - name: Install nsound in a new venv and run the python tests
      run: python tools/test_pip_install.py

  bazel:

    name: bazel / clang

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      name: Checkout source
    - uses: bazel-contrib/setup-bazel@0.19.1
      name: Setup Bazel
      with:
        bazelisk-cache: true
        disk-cache: macos-clang
        repository-cache: true
    - name: Build nsound
      run: bazel build //...
    - name: Run unit tests
      run: bazel test //...
