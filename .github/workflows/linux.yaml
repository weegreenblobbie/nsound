name: linux

on:
  push:
    branches:
    - master
    - 'release/**'
  pull_request:
    branches:
    - master
    - 'release/**'

# Checks show as "<platform> / <build system> / <task>".

jobs:
  pip:

    name: pip / python ${{ matrix.python }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python the package supports.
        python: ['3.10', '3.14']

    steps:
    - uses: actions/checkout@v7
      name: Checkout source
    - uses: actions/setup-python@v7
      name: Install Python
      with:
        python-version: ${{ matrix.python }}
    - name: Install nsound in a new venv and run the python tests
      run: python tools/test_pip_install.py

  bazel:

    name: bazel / ${{ matrix.compiler }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
    - uses: actions/checkout@v7
      name: Checkout source
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get -y install libomp-dev
    - uses: bazel-contrib/setup-bazel@0.19.1
      name: Setup Bazel
      with:
        bazelisk-cache: true
        disk-cache: linux-${{ matrix.compiler }}
        repository-cache: true
    - name: Build nsound
      run: bazel build --config=${{ matrix.compiler }} //...
    - name: Run unit tests
      run: bazel test --config=${{ matrix.compiler }} //...

  coverage:

    name: bazel / coverage

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      name: Checkout source
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get -y install libomp-dev lcov
    - uses: bazel-contrib/setup-bazel@0.19.1
      name: Setup Bazel
      with:
        bazelisk-cache: true
        disk-cache: linux-coverage
        repository-cache: true
    # Fails if the src/Nsound line coverage drops below the minimum in
    # tools/check_coverage.py.
    - name: Check coverage
      run: tools/coverage.sh
